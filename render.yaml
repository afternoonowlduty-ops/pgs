services:
  - type: web
    name: grove-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python grove_bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DISCORD_TOKEN
        sync: false
      - key: PGS_API_KEYS
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: PGS_MODEL
        value: deepseek-v4-flash-0731
      - key: PGS_BASE_URL
        value: https://api.pgsgrove.com/v1
